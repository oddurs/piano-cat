name: Idea
description: Suggest something — a piece, a gesture, a bit of cat behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should it do, and what would it feel like to use?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: |
        What does this make better? "It would be fun" is a completely
        acceptable answer for a toy.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Suggesting a piece?** It has to be public domain, and it has to be
        available as a digital edition that can be named — scores here are
        generated by `tools/import-kern.mjs` or `tools/import-midi.mjs`, never
        typed from memory. A link to the edition is the whole ask. See
        [`lib/scores/SOURCES.md`](../../lib/scores/SOURCES.md).
